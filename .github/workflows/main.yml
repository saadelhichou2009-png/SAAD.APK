name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Go to project folder
        run: cd راتبوت   # أو cd RATBot حسب الاسم الحقيقي

      - name: Grant execute permission for gradlew
        run: chmod +x راتبوت/gradlew

      - name: Build APK
        run: |
          cd راتبوت
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: راتبوت/app/build/outputs/apk/debug/app-debug.apk
